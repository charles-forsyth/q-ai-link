[project]
name = "q-link-rpg"
version = "0.1.6"
description = "A 2D tile-based Grid World game using Pygame with Q-Learning AI"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.129.0",
    "jinja2>=3.1.6",
    "numpy>=1.26.0",
    "pygame>=2.5.0",
    "typer>=0.9.0",
    "uvicorn>=0.41.0",
]

[project.scripts]
q-link = "q_link_rpg.cli:app"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest-mock>=3.15.1",
]
